<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Conference registation form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<P>Enter your name!<input type = "text" id="Name" maxlength="70"> 
  <br> Enter your password: <input type="password" id="password">
  <br> Enter in Email: <input tpye="Email" id="user_email"> 
  <div id="Size Shirts">
    What size shirt should all attendees recieve? (select one size)
    <select>
      <option>Small</option>
      <option>Medium</option>
      <option>Large</option>
    </select>
  </div>
  <br>Enter in the Date of the Conference: <input type="date" id="date_selection">
  <div id="email_updates">
    <br>Recieve Email updates?
    <input name="Email_radio"  type="radio">Yes
    <input name="Email_radio"  type="radio">No
  </div>
  <div id="Time_of_day">
    <br>What time of day will this happen? 
    <br>Morning<input name="Time_of_day"  type="checkbox">
    <br>Afternoon<input name="Time_of_day" type="checkbox">
  </div>
  <div id="Special_requests">
    <p>
      <br> Special requests?
      <br> <textarea rows="7" cols="70"></textarea>
    </p>
  </div>
  <input type="submit">
</P>
